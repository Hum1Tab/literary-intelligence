name: Literary Intelligence validation
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q scripts tests
      - name: Contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Sample quotation verification
        run: python scripts/validate_report.py examples/sample-report.json --manuscript examples/manuscript.txt
